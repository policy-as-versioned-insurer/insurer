# The insurer pins `platform` as a PINNED, SIGNED dependency, exactly as the
# three adopters do (driftwood/gitops/platform/platform-pin.yaml). The pricer
# in this repo prices in the platform's £ -- fair.py's money helpers and the
# composition that books the premium as a contract cost line -- so which signed
# version of the platform this party is on is a fact, not an implicit "latest".
#
# WHY THIS FILE EXISTS AT ALL, and why it carries no Kustomization: ticket 21
# left this repo's party.yaml `inherits[]` empty because platform/party/
# party_artefact.py checks a `platform/implementations` edge against
# `gitops/platform/platform-pin.yaml`'s own spec.ref.tag, and this repo had no
# such file. The insurer runs no cluster and reconciles nothing, so the
# adopters' second document (the Kustomization that fans platform's version
# array onto a cluster) would be a claim about a cluster that does not exist.
# The GitRepository alone IS the pin: it is what the checker reads, what
# Renovate bumps (renovate.json, git-refs datasource, tag and commit together)
# and what a reader looks at to know which platform this party priced against.
# A pure consumer therefore CAN carry the pin the checker expects; no comment
# in the checker was needed and none was added.
#
# Bump = one reviewed PR changing .spec.ref.tag and .spec.ref.commit together,
# and the quotes re-render against the new platform in the same PR.
#
# 2026-09-04, eco-system tickets 62 and 77. This pin read v1.1.1 while release.yml
# checked platform out with NO ref -- the default branch -- so nothing ever ran
# against the tree this file names. Ticket 77 item 4 pinned that checkout to this
# file, which turned the stale value into a red gate: v1.1.1's party/schema.json
# predates `reporting_currency` and `publishes`, both of which this repo's own
# party.yaml carries, so verify-insurer-party.sh refused
# ("unknown top-level field 'reporting_currency'"). Moved to v2.0.1, the tag the
# three adopters already pin and the oldest one whose party schema this party
# validates against; party.yaml's inherits[] platform edge moved with it, because
# party_artefact.py checks that edge against this file's tag. The quotes did not
# re-render: pricing/quote.py imports nothing from platform except the ticket-77
# pin rule, and no arithmetic in it comes from fair.py.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/policy-as-versioned-platform/platform
  ref:
    tag: v2.0.1
    commit: 533dccb0a823001b396fd60ab08014bf75065a37
