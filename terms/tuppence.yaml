# The insurer's OWN signed terms for tuppence (ticket 36; ticket 14 answers 1
# and 5). See driftwood.yaml for the long form of every field, including why the
# attachment is not restated here: it is the insured's own signed appetite.
version: 1.0.0
published_at: '2026-08-28T00:00:00Z'
valid_from: '2026-08-28'
valid_until: '2027-08-28'
currency: GBP
# tuppence signs no size, so ico's converter prices it at the statutory cap and
# its exposure is the widest in the estate. The limit is written well inside
# that: the layer clamps at the limit, and everything above the limit is
# retained -- a fact its own composed prices[] carries, not a surprise.
limit: { amount: 5000000, currency: GBP }
rate: 0.03
load: 0.3
# THE IMPLIED LOSS RATIO BAND (eco-system ticket 79 item 6). Delegated
# (ADR-0025): a dimensionless calibration knob of the same kind as `rate` and
# `load` above, stated rather than hidden, and the owner may overrule it.
#
# verify-insurer-quote.sh prints `layer / premium` on EVERY run and reds outside
# this band. That quotient is IDENTICALLY 1 / (rate x (1 + load)), so it is a
# statement about this carrier's own two knobs and not about the insured -- which
# is exactly why it is worth banding. Above the maximum the premium is a token
# sum against the layer it stands behind (a rate on line too thin for the account
# to fund itself); below the minimum the premium approaches the whole exposure,
# which is prepayment rather than cover.
#
# COULD NOT LOOK, and it is the whole limit of this number: the numerator is the
# insured's ORDINAL exposure inside the layer, not an expected layer loss. The
# insured signs a point total and no aggregate loss distribution exists to take
# an expectation from (see the ponytail ceiling in pricing/quote.py). So this is
# the reciprocal of the rate on line and NOT an actuarial loss ratio. It becomes
# one at formula 2.0.0.
loss_ratio_band: { min: 5.0, max: 50.0 }
exclusions:
  - regime: uk-gdpr
    control_ids: [pl-2]
    why: >-
      The share of the uk-gdpr lower-tier exposure ico's published weights put
      on the system security plan (pl-2) is retained by the insured.
conditions:
  - source: nist
    id: ac-6
    consequence: void
    why: Least privilege enforced on the governed namespace.
