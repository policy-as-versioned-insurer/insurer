name: fetch

# insurer's publisher clock (ticket 28; ADR-0024, decisions D1 and D2).
# 05:31 UTC, insurer's own choice. No cross-org ordering is promised: every
# org picks its own time, GitHub delays scheduled runs under load, and every
# joint in this chain waits on a human merge anyway.
#
# What it does, once a day: read what THIS repository has published -- every
# entry on its own party.yaml `publishes[]` -- and append one dated line per
# entry to observations/<feed>.jsonl on the `observations` branch, carrying the
# newest published version and the sha256 of its payload. That is a series, not
# a release. A run of identical hashes is evidence that nothing moved; a hash
# that moves without a version moving is a tamper this clock can see.
#
# D1 in one sentence: this clock appends observations and never commits a
# declaration. It writes nothing to main -- not a feed, not a bump, not a pin --
# and the cage step fails the run if anything outside the observation lane is
# left in the tree. The observation commit is gitsign-signed by this workflow's
# own Actions identity, the same keyless OIDC -> Fulcio -> Rekor chain
# cut-release.yml already uses for tags, so the lane is a cage rather than a
# policy statement once .github/rulesets/observation-lane.json is applied.
#
# Ticket 36 added the second job below, `requote`: the insurer's PRICING runs on
# this same clock. Once a day, per insured adopter, it reads the adopter's own
# signed exposure at the tag this repo pins, re-prices it under the insurer's own
# signed terms with pricing/quote.py's versioned formula, and computes the bump
# under that quote feed's own rule.yaml. Bump not `none` (D2) -> it opens a PR
# carrying the new quote and the declared bump, and a HUMAN merges it and
# dispatches cut-release.yml. Bump `none` -> nothing but the observation the
# first job already appends. The clock never commits a quote: a price nobody
# reviewed is not a contract.

on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Trimmed 2026-09-06 (eco-system ticket 67 item (c)): this list was the hub's four-path
# lane, copied verbatim into twelve unit workflows across eight repositories. It named paths
# this repository has never owned. That is not cosmetic: the hub's verify/schedules/lane.py
# grades every commit a scheduled identity lands HERE against the union of THIS repository's own
# declarations, so each copied path was one a clock here could land and be graded green for. It
# now names only what this repository owns, which every commit a clock has landed here already
# fits. Graded by the hub's verify/map-surface/verify-map-surface.sh.
# The observation lane, declared once as data so the cage step and
# verify/schedules/verify-schedules.sh read the SAME list (ADR-0024, D1). These
# are the only paths any scheduled job in this repository may ever commit.
env:
  OBSERVATION_LANE: "observations"
  # Eco-system ticket 85, 2026-09-04, shared verbatim with the feeds clock that this shape was
  # copied from. This job's readers are python heredocs today, so they write no bytecode into the
  # tree -- but the requote job below runs `python3 pricing/quote.py`, which does, and the append
  # step switches to an orphan branch that carries no .gitignore, where the cage reads every
  # ignored file as an untracked one outside the lane. Feeds lost five of six feeds' observations
  # to exactly that. Prevented here rather than diagnosed here.
  PYTHONDONTWRITEBYTECODE: "1"
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install pinned gitsign (binary + checksum, no marketplace action)
        run: |
          set -euo pipefail
          curl -sSL -o gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  gitsign" | sha256sum -c -
          chmod +x gitsign && sudo mv gitsign /usr/local/bin/gitsign
          rm -f gitsign

      - name: read what this publisher has published, and hash it
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          mkdir -p "${RUNNER_TEMP}/obs"
          python3 - <<'PY'
          import datetime as dt, glob, hashlib, json, os, re, sys
          import yaml


          def declared_bump(feed_dir):
              """The bump this publisher has queued, from <path>/bump.yaml's one
              line. Flat key: value, read with the standard library on purpose --
              the same shape and the same reason as every feed's rule.yaml."""
              path = os.path.join(feed_dir, "bump.yaml")
              if not os.path.exists(path):
                  return None
              for line in open(path):
                  if line.startswith("bump:"):
                      return line.partition(":")[2].strip()
              return None


          def newest(feed_dir):
              """(version, path) of the newest published v<N>/feed.json, or None."""
              found = []
              for path in glob.glob(os.path.join(feed_dir, "v*", "feed.json")):
                  major = re.fullmatch(r"v(\d+)", os.path.basename(os.path.dirname(path)))
                  if major:
                      found.append((int(major.group(1)), path))
              return sorted(found)[-1] if found else None


          out = os.path.join(os.environ["RUNNER_TEMP"], "obs")
          now = dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds")
          party = yaml.safe_load(open("party.yaml")) or {}
          published = party.get("publishes") or []
          if not published:
              sys.exit("REFUSED: party.yaml declares no publishes[] -- a publisher clock with "
                       "nothing to observe is a clock lying about being one")
          for entry in published:
              name = entry.get("name")
              if not name:
                  continue
              feed_dir = entry.get("path") or name
              line = {"observed_at": now, "publisher": party.get("party"), "feed": name,
                      "kind": entry.get("kind"), "declared_bump": declared_bump(feed_dir),
                      "revoked": entry.get("revoked") or []}
              found = newest(feed_dir)
              if found:
                  doc = json.load(open(found[1]))
                  body = json.dumps(doc.get("payload"), sort_keys=True,
                                    separators=(",", ":")).encode()
                  line.update(published_version=doc.get("version"),
                              published_at=doc.get("published_at"),
                              payload_sha256=hashlib.sha256(body).hexdigest())
              else:
                  line.update(published_version=None, payload_sha256=None,
                              note=f"no {feed_dir}/v<N>/feed.json in this repository yet -- "
                                   f"this clock records that it looked and found none, which "
                                   f"is a fact with a date on it, not a silence")
              with open(os.path.join(out, f"{name}.jsonl"), "a") as fh:
                  fh.write(json.dumps(line, sort_keys=True) + "\n")
              print(json.dumps(line, sort_keys=True))
          PY

      - name: append the observations to the observations branch
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${RUNNER_TEMP}"/obs/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing observed"; exit 0; fi
          # Before the branch switch, not after (ticket 85, 2026-09-04). This step had no clean
          # at all: whatever an earlier step left in the tree -- tracked or gitignored -- came
          # across to the orphan `observations` branch, which has no .gitignore, and the cage
          # below refused it as a declaration outside the lane. The readings this step commits
          # are already captured under ${RUNNER_TEMP}/obs, so nothing here is lost. Same two
          # flags and the same reason as the feeds clock and the orphan path below.
          git checkout -- . >/dev/null 2>&1 || true
          git clean -ffdx -e .git >/dev/null 2>&1 || true
          if git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            git fetch origin observations:observations
            git checkout observations
          else
            git checkout --orphan observations
            git rm -rf --cached . >/dev/null 2>&1 || true
            # `git clean -ffdx -e .git`, not `rm -rf ./*`: the glob does not match
            # dot entries, so .github/ and .gitignore survived the wipe and the
            # cage step below then read them as untracked files OUTSIDE the lane
            # and failed the run. Every publisher's FIRST run died there, so the
            # observations branch never came into existence at all, and the next
            # run took the same path and died the same way (reproduced 2026-08-28).
            git clean -ffdx -e .git >/dev/null
            mkdir -p observations
            printf '%s\n' \
              "# observations" "" \
              "Dated readings from .github/workflows/fetch.yml (ADR-0024, D1/D2)." \
              "One JSON line per published feed per run. Never a declaration:" \
              "nothing here is published, pinned or enforced. The series exists so" \
              "that a day on which nothing changed is still a fact with a date on it." \
              > observations/README.md
          fi
          mkdir -p observations
          for f in "${files[@]}"; do
            cat "$f" >> "observations/$(basename "$f")"
          done

      # --- the cage (ADR-0024, D1) -------------------------------------------
      # Only OBSERVATION_LANE paths are staged. Anything else left in the tree is
      # a declaration escaping the lane, and this step fails the run rather than
      # pushing it. The commit is signed with this run's own Actions identity.
      - name: the observation cage -- a clock appends observations, never a declaration
        run: |
          set -euo pipefail
          # `git reset` FIRST: the cage builds the index and nothing else. The old
          # guard filtered `git status --porcelain` with `grep -v '^[AMD] '`, which
          # strips exactly the staged-and-clean entries -- so a declaration any
          # earlier step had left in the index was committed and pushed while this
          # step printed "this clock declared nothing" (review, 2026-08-28).
          git reset -q
          for path in ${OBSERVATION_LANE}; do
            # -f: talk/captures/ is gitignored for local runs; the clock is the one
            # caller allowed to commit it.
            if [ -e "${path}" ]; then git add -Af -- "${path}"; fi
          done
          # The STAGED set, judged against the same OBSERVATION_LANE list, never a
          # second regex that could drift from it.
          bad=""
          for f in $(git diff --cached --name-only); do
            ok=0
            for path in ${OBSERVATION_LANE}; do
              case "${f}" in "${path}"|"${path}"/*) ok=1 ;; esac
            done
            [ "${ok}" = 1 ] || bad="${bad} ${f}"
          done
          if [ -n "${bad}" ]; then
            echo "::error::this clock staged a declaration outside the observation lane"
            echo "${bad}"
            exit 1
          fi
          outside="$(git status --porcelain --untracked-files=all | grep -v '^[AMD] ' || true)"
          if [ -n "${outside}" ]; then
            echo "::error::the scheduled fetch left a change outside the observation lane"
            echo "${outside}"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "ok  nothing to observe, and nothing declared"; exit 0
          fi
          git -c gpg.format=x509 -c gpg.x509.program=gitsign \
            -c user.name="insurer publisher clock" \
            -c user.email="fetch-bot@policy-as-versioned-insurer.invalid" \
            commit -S -m "observe insurer's published feeds"
          git push origin observations

  # -----------------------------------------------------------------------
  # ticket 36: the pricing seat, on the same clock (ADR-0019/D2, ADR-0021)
  # -----------------------------------------------------------------------
  requote:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # one at a time: every adopter pushes a branch and asks gh for a PR, and a
      # serial matrix keeps the rate limit and the review queue predictable.
      max-parallel: 1
      matrix:
        adopter: [driftwood, tuppence, ludlow]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install pinned gitsign (binary + checksum, no marketplace action)
        run: |
          set -euo pipefail
          curl -sSL -o gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  gitsign" | sha256sum -c -
          chmod +x gitsign && sudo mv gitsign /usr/local/bin/gitsign
          rm -f gitsign

      # Ticket 77 item 1. The pricer reads the "a pinned tree must carry the section the
      # pin is used for" rule out of platform/party/pin_content.py, through the platform
      # release this repository pins -- so the platform checkout is part of pricing now, not
      # only of releasing. Pinned, like every other cross-org checkout in this estate.
      # platform v3.0.0 is the first tag that carries pin_content.py (checked tag by tag), and
      # this repository's pin names v3.3.0 since 2026-09-24, so the rule runs here. A pinned
      # release without the file makes quote.py say could-not-look and price on, which is why
      # this step cannot stop the clock for want of the rule.
      - name: read this repository's own platform pin
        id: platform_pin
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 -c "
          import yaml
          docs = [d for d in yaml.safe_load_all(open('gitops/platform/platform-pin.yaml')) if d]
          ref = next(d for d in docs if d.get('kind') == 'GitRepository')['spec']['ref']
          print('tag=%s' % ref['tag']); print('commit=%s' % ref['commit'])" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-platform/platform
          path: .platform
          ref: ${{ steps.platform_pin.outputs.tag }}

      - name: platform is at the {tag, commit} pair this repository pins
        run: |
          set -euo pipefail
          head="$(git -C .platform rev-parse HEAD)"
          if [ "${{ steps.platform_pin.outputs.commit }}" != "${head}" ]; then
            echo "REFUSED: .platform is at ${head}, but gitops/platform/platform-pin.yaml pins ${{ steps.platform_pin.outputs.tag }} at ${{ steps.platform_pin.outputs.commit }}" >&2
            exit 1
          fi

      # The pin, read from this repo's OWN party.yaml inherits[] -- never a
      # branch, never "latest". A quote is priced against the exact signed
      # version the artefact names, which is also what priced_against records.
      - name: read the exposure pin for ${{ matrix.adopter }}
        id: pin
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          tag=$(python3 -c "
          import sys, yaml
          party = yaml.safe_load(open('party.yaml'))
          pin = next((e for e in party['inherits']
                      if e['party'] == '${{ matrix.adopter }}' and e.get('name') == 'exposure'), None)
          sys.exit('REFUSED: party.yaml pins no exposure parent for ${{ matrix.adopter }}') if pin is None else None
          print(pin['version'])")
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # A tag a human has not cut yet is a COULD-NOT-LOOK, not a failure and
          # never a reason to price against a branch: the exposure is only signed
          # once the adopter's cut-release.yml has run.
          if git ls-remote --exit-code --tags \
               "https://github.com/policy-as-versioned-${{ matrix.adopter }}/${{ matrix.adopter }}" \
               "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.adopter }} has no signed tag ${tag} yet -- nothing to price against today"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: check out ${{ matrix.adopter }} at its signed tag
        if: steps.pin.outputs.signed == 'true'
        uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-${{ matrix.adopter }}/${{ matrix.adopter }}
          ref: ${{ steps.pin.outputs.tag }}
          path: .adopters/${{ matrix.adopter }}

      - name: re-price and compute the bump under the feed's own rule.yaml
        id: price
        if: steps.pin.outputs.signed == 'true'
        run: |
          set -euo pipefail
          bump=$(PLATFORM_DIR=.platform python3 pricing/quote.py bump "${{ matrix.adopter }}" --adopters-dir .adopters)
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ matrix.adopter }}: computed bump ${bump}"
          if [ "${bump}" != "none" ]; then
            PLATFORM_DIR=.platform python3 pricing/quote.py render "${{ matrix.adopter }}" --adopters-dir .adopters
            sed -i "s/^bump: .*/bump: ${bump}/" "quote/${{ matrix.adopter }}/bump.yaml"
            python3 -c "
          import json
          d = json.load(open('quote/${{ matrix.adopter }}/v1/feed.json'))['payload']
          print('premium=%.2f %s' % (d['premium']['amount'], d['premium']['currency']))" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: propose the re-quote as a PR (a human merges; this clock never commits one)
        if: steps.price.outputs.bump != '' && steps.price.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          ADOPTER: ${{ matrix.adopter }}
          BUMP: ${{ steps.price.outputs.bump }}
          PREMIUM: ${{ steps.price.outputs.premium }}
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          case "${ADOPTER}" in driftwood|ludlow|tuppence) ;; *) exit 1;; esac
          source_head="$(git rev-parse HEAD)"
          paths=("quote/${ADOPTER}/v1/feed.json" "quote/${ADOPTER}/bump.yaml")
          # Only these generated paths belong to this step. Unrelated dirty/staged
          # declarations survive so the always-running cage still rejects them.
          cleanup() {
            rc=$?
            trap - EXIT
            git checkout --detach "${source_head}" --quiet || rc=1
            git restore --source="${source_head}" --staged --worktree -- "${paths[@]}" || rc=1
            exit "${rc}"
          }
          trap cleanup EXIT
          branch="requote/${ADOPTER}-$(date -u +%Y%m%d)"
          read_pr() {
            gh pr list --repo "${GITHUB_REPOSITORY}" --base main --head "${branch}" \
              --state all --limit 100 --json number,state,headRefOid,url > "$RUNNER_TEMP/requote-prs.json" || {
                echo "PENDING: proposal lifecycle could not be read" >&2; return 1;
              }
            python3 - "$RUNNER_TEMP/requote-prs.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          if len(rows) > 1:
              sys.exit("PENDING: ambiguous proposal lifecycle; no branch or PR is changed")
          if not rows:
              print("NONE"); sys.exit()
          row = rows[0]
          if row.get('state') not in {'OPEN', 'CLOSED', 'MERGED'}:
              sys.exit("PENDING: unreadable proposal lifecycle")
          print(row['state'], row['headRefOid'], row['url'])
          PY
          }
          lifecycle="$(read_pr)"
          read -r state pr_head pr_url <<< "${lifecycle}"
          if remote="$(git ls-remote --exit-code --heads origin "refs/heads/${branch}")"; then
            proposal_head="${remote%%[[:space:]]*}"
            git fetch --no-tags origin "refs/heads/${branch}"
            [ "$(git rev-parse FETCH_HEAD)" = "${proposal_head}" ] || {
              echo "::error::PENDING: proposal ref moved while read"; exit 1;
            }
          else
            probe_rc=$?
            [ "${probe_rc}" = 2 ] || { echo "::error::PENDING: proposal ref could not be read"; exit 1; }
            if [[ "${state}" = CLOSED || "${state}" = MERGED ]]; then
              echo "::notice::${state} proposal ${pr_url} is respected; its deleted branch is not recreated and no new quote is proposed."
              exit 0
            fi
            [ "${state}" = NONE ] || { echo "::error::PENDING: open PR has no readable branch"; exit 1; }
            git checkout -b "${branch}"
            # --only keeps unrelated staged declarations out of the proposal.
            git -c gpg.format=x509 -c gpg.x509.program=gitsign \
              -c user.name="insurer pricing clock" \
              -c user.email="requote-bot@policy-as-versioned-insurer.invalid" \
              commit -S --only -m "quote-${ADOPTER}: ${BUMP} re-quote against ${TAG}" -- "${paths[@]}"
            proposal_head="$(git rev-parse HEAD)"
            # Empty expectation: the remote ref MUST NOT EXIST. This cannot even
            # fast-forward over an ancestor ref created by a concurrent run.
            git push --force-with-lease="refs/heads/${branch}:" origin "HEAD:refs/heads/${branch}" || {
              echo "::error::PENDING: proposal ref was not created; an existing ref is never overwritten"
              exit 1
            }
          fi
          parent="$(git show -s --format=%P "${proposal_head}")"
          [[ "${parent}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::PENDING: proposal is not one original commit"; exit 1; }
          git merge-base --is-ancestor "${parent}" "${source_head}"
          [ "$(git show -s --format=%ae "${proposal_head}")" = requote-bot@policy-as-versioned-insurer.invalid ]
          [ "$(git show -s --format=%ce "${proposal_head}")" = requote-bot@policy-as-versioned-insurer.invalid ]
          subject="$(git show -s --format=%s "${proposal_head}")"
          case "${subject}" in
            "quote-${ADOPTER}: major re-quote against "*|"quote-${ADOPTER}: minor re-quote against "*|"quote-${ADOPTER}: patch re-quote against "*) ;;
            *) echo "::error::PENDING: proposal is not this adopter's clock re-quote"; exit 1;;
          esac
          changed="$(git diff --name-only "${parent}" "${proposal_head}")"
          [ -n "${changed}" ] || { echo "::error::PENDING: proposal has no quote change"; exit 1; }
          while IFS= read -r path; do
            case "${path}" in "${paths[0]}"|"${paths[1]}") ;;
              *) echo "::error::PENDING: proposal changes paths outside this quote"; exit 1;;
            esac
          done <<< "${changed}"
          gitsign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/fetch.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "${parent}" "${proposal_head}"
          if git diff --quiet "${proposal_head}" -- "${paths[@]}"; then
            different=0
          else
            diff_rc=$?
            [ "${diff_rc}" = 1 ] || { echo "::error::PENDING: quote bytes could not be compared"; exit 1; }
            different=1
          fi
          if [[ "${state}" = CLOSED || "${state}" = MERGED ]]; then
            if [ "${different}" = 1 ]; then
              echo "::error::PENDING: newly computed bytes are different; ${state} proposal ${pr_url} is respected and no current quote is proposed."
              exit 1
            fi
            echo "::notice::${state} proposal ${pr_url} is respected; no new quote is proposed."
            exit 0
          fi
          [ "${state}" != OPEN ] || [ "${pr_head}" = "${proposal_head}" ] || {
            echo "::error::PENDING: PR head differs from the preserved original"; exit 1;
          }
          if [ "${state}" = NONE ]; then
            {
              printf 'Original signed re-quote proposal for %s.\n\nCommit: %s\n' "${ADOPTER}" "${proposal_head}"
              echo "Review the contract amount, signed exposure/platform pins and computed bump in the committed quote and bump files."
              if [ "${different}" = 1 ]; then
                echo "PENDING: this run computed different bytes; this recovered original is not the current computation."
              fi
              echo "Merging publishes nothing. A human dispatches cut-release.yml for the signed quote release."
            } > "$RUNNER_TEMP/requote-body.md"
            if ! gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${branch}" \
              --title "${subject}" --body-file "$RUNNER_TEMP/requote-body.md"; then
              # A concurrent run may have created the same PR. Re-read; never guess.
              echo "::warning::PR creation returned no success; checking the exact original's lifecycle"
            fi
            lifecycle="$(read_pr)"
            read -r state pr_head pr_url <<< "${lifecycle}"
            [ "${state}" = OPEN ] && [ "${pr_head}" = "${proposal_head}" ] || {
              echo "::error::PENDING: original proposal is durable but has no matching open PR"; exit 1;
            }
          fi
          [ "$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)" = "${proposal_head}" ] || {
            echo "::error::PENDING: proposal ref changed during publication"; exit 1;
          }
          if [ "${different}" = 1 ]; then
            echo "::error::PENDING: preserved ${proposal_head} at ${pr_url}; newly computed quote bytes are different and are not proposed"
            exit 1
          fi
          echo "::notice::Original ${proposal_head} is proposed at ${pr_url}; main is unchanged."

      # The same cage the fetch job carries, for the same reason (D1): a clock
      # proposes, it never declares. The PR step above works on its OWN branch;
      # anything still sitting in the tree here would be a quote about to reach
      # main without a review, so the run fails instead. Named for what
      # verify/schedules/schedules.py looks for, because one name for one cage is
      # how the workflow and the checker are kept from drifting apart.
      - name: the observation cage -- nothing this clock priced reaches main unreviewed
        if: always()
        run: |
          set -euo pipefail
          git checkout main --quiet 2>/dev/null || true
          left="$(git status --porcelain --untracked-files=all -- . ':!.adopters' ':!.platform' || true)"
          if [ -n "${left}" ]; then
            echo "::error::the scheduled re-quote left an uncommitted change on main"
            echo "${left}"
            exit 1
          fi
          echo "ok  this clock proposed, and declared nothing"

# registered 2026-09-01: this line exists so a push touches the workflow file (ecosystem ticket 57)
