name: release

# Runs on every semver tag push. Verifies the tag's gitsign signature
# identity-pinned against an offline Rekor bundle, checks the tag still
# resolves to the commit this run was triggered from, runs the schema's own
# offline verify script as a release gate, and publishes a GitHub Release.
# See cut-release.yml for how the tag gets here.
#
# verify-insurer-party.sh is offline and self-contained today (party.yaml,
# publishes[] and the payload schema -- ticket 21's feed contract). The
# sibling `platform` checkout below is here ahead of ticket 36, the real
# pricing seat, which pins the platform's implementations the same way
# ico's release gate pins `../platform/fair/fair.py` -- the same
# two-checkouts-in-one-run technique driftwood's shift-left gate and ico's
# own release gate use. Unused by the current gate; kept so ticket 36 does
# not need a second workflow edit.
#
# EXPECTED_IDENTITY_REGEXP is cut-release.yml's own Actions identity (ambient
# credential, no human login) -- see that workflow's header comment for why.
# Anchored to allow main or a release/<major>.<minor>.x maintenance branch,
# so a backport's tag (dispatched from that branch, not main) still verifies.
# See ticket cs-14.
#
# Also accepts workflow_dispatch: a workflow run started BY the default
# Actions credential (cut-release.yml's own `git push`) does not, by GitHub
# design, trigger other workflows -- the tag lands but this workflow's own
# `push: tags:` event never fires. workflow_dispatch is the documented way
# round that: verify+publish stays reachable for every tag, chained or not.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to verify + publish (workflow_dispatch path only)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae
  EXPECTED_IDENTITY_REGEXP: ^https://github\.com/policy-as-versioned-insurer/insurer/\.github/workflows/cut-release\.yml@refs/heads/(main|release/[0-9]+\.[0-9]+\.x)$
  EXPECTED_ISSUER: https://token.actions.githubusercontent.com

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: insurer
          fetch-depth: 0
          fetch-tags: true

      # Ticket 77 item 4. This checkout used to carry no `ref:` -- platform's DEFAULT
      # BRANCH -- while this repository's own party.yaml pins platform/implementations and
      # gitops/platform/platform-pin.yaml carries the {tag, commit} pair Renovate bumps.
      # The pin is read out of that file rather than written here, so the ref cannot drift
      # from the artefact.
      - name: read this repository's own platform pin
        id: platform_pin
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 -c "
          import yaml
          docs = [d for d in yaml.safe_load_all(open('insurer/gitops/platform/platform-pin.yaml')) if d]
          ref = next(d for d in docs if d.get('kind') == 'GitRepository')['spec']['ref']
          print('tag=%s' % ref['tag']); print('commit=%s' % ref['commit'])" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-platform/platform
          path: platform
          ref: ${{ steps.platform_pin.outputs.tag }}

      - name: platform is at the {tag, commit} pair this repository pins
        run: |
          set -euo pipefail
          head="$(git -C platform rev-parse HEAD)"
          if [ "${{ steps.platform_pin.outputs.commit }}" != "${head}" ]; then
            echo "REFUSED: platform is at ${head}, but gitops/platform/platform-pin.yaml pins ${{ steps.platform_pin.outputs.tag }} at ${{ steps.platform_pin.outputs.commit }}" >&2
            exit 1
          fi
          echo "ok  platform is ${{ steps.platform_pin.outputs.tag }}"

      - name: install pinned gitsign (binary + checksum, no marketplace action)
        run: |
          set -euo pipefail
          curl -sSL -o gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  gitsign" | sha256sum -c -
          chmod +x gitsign && sudo mv gitsign /usr/local/bin/gitsign

      - name: insurer party offline verify (release gate)
        working-directory: insurer
        run: ./verify-insurer-party.sh

      - name: gitsign verify-tag, identity-pinned, offline Rekor bundle
        working-directory: insurer
        env:
          GITSIGN_REKOR_MODE: offline
        run: |
          set -euo pipefail
          # actions/checkout's second fetch flattens the annotated tag object
          # gitsign needs -- re-fetch the real tag ref before verifying it.
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --force
          gitsign verify-tag "${TAG}" \
            --certificate-identity-regexp="${EXPECTED_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer="${EXPECTED_ISSUER}"

      - name: tag still resolves to the commit this run was triggered from
        working-directory: insurer
        # Only meaningful on the push-triggered path -- see the on: comment.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          resolved=$(git rev-parse "${TAG}^{commit}")
          if [ "${resolved}" != "${GITHUB_SHA}" ]; then
            echo "FAIL: tag ${TAG} resolves to ${resolved}, run was triggered from ${GITHUB_SHA}"
            exit 1
          fi
          echo "OK: ${TAG} -> ${resolved}"

      - name: publish GitHub Release recording the resolved SHA
        working-directory: insurer
        run: |
          set -euo pipefail
          resolved=$(git rev-parse "${TAG}^{commit}")
          {
            git tag -l --format='%(contents)' "${TAG}" | sed '/^-----BEGIN SIGNED MESSAGE-----$/,$d'
            echo "---"
            echo "Verified gitsign signature (identity regexp: ${EXPECTED_IDENTITY_REGEXP}, issuer: ${EXPECTED_ISSUER}). Resolved commit: ${resolved}."
          } > release-notes.md
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

# registered 2026-09-01: this line exists so a push touches the workflow file (ecosystem ticket 57)
